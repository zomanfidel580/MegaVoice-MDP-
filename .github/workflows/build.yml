name: Build APK et EXE
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    env: {ELECTRON_SKIP_BINARY_DOWNLOAD: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: |
          mkdir www && cp index.html mv_*.js www/
          npm i --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/haptics@6 @capacitor/assets@3
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/<activity(?=\s)/<activity android:screenOrientation="sensorLandscape"/' $M
          perl -0pi -e 's#(<uses-permission android:name="android.permission.INTERNET" ?/>)#$1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />#' $M
          grep -q 'RECORD_AUDIO' $M || { echo "ERREUR: permissions non ajoutees"; exit 1; }
          grep -A3 "<activity" $M
          grep -q 'screenOrientation="sensorLandscape"' $M || { echo "ERREUR: paysage non applique"; exit 1; }
          mkdir assets && cp icon.png assets/icon.png
          npx capacitor-assets generate --android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: MegaVoice-APK, path: android/app/build/outputs/apk/debug/app-debug.apk}
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          npm i
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with: {name: MegaVoice-EXE, path: dist/*.exe}
