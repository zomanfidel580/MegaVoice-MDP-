name: Build APK et EXE
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    env: {ELECTRON_SKIP_BINARY_DOWNLOAD: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: |
          mkdir www && cp index.html mv_*.js www/
          npm i --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          npx cap add android
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          mkdir assets && cp icon.png assets/icon.png
          npx capacitor-assets generate --android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: MegaVoice-APK, path: android/app/build/outputs/apk/debug/app-debug.apk}
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          npm i
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with: {name: MegaVoice-EXE, path: dist/*.exe}
